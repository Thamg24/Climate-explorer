<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Climate Impact Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
/* ── OENVC design tokens ────────────────────────────── */
:root {
  --bg:#F3F5F6; --panel:#FFFFFF; --ink:#16202A; --muted:#5B6873;
  --line:#D7DDE2; --soft:#E9EDF0; --accent:#1F5F8B;
  --ok:#2E7D4F; --warn:#B86E00; --bad:#B42318;
  --f-display:'Barlow Condensed',sans-serif;
  --f-body:'Barlow',sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
  --rail:400px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --panel:#161E26; --ink:#E4EAEF; --muted:#94A3AF;
    --line:#2A3641; --soft:#1E2A35;
    --accent:#6FB0DE; --ok:#5FC28A; --warn:#E5A23A; --bad:#F2776B;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --panel:#161E26; --ink:#E4EAEF; --muted:#94A3AF;
  --line:#2A3641; --soft:#1E2A35;
  --accent:#6FB0DE; --ok:#5FC28A; --warn:#E5A23A; --bad:#F2776B;
}

/* ── Reset ──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--bg)}

/* ── App shell ──────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}

/* ── Rail ───────────────────────────────────────────── */
.rail{
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.rail-head{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.rail-head h1{
  font-family:var(--f-display);
  font-size:1.25rem;font-weight:700;
  letter-spacing:.01em;
  color:var(--ink);
  line-height:1.2;
}
.rail-head p{
  font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.4;
}

/* ── Search ─────────────────────────────────────────── */
.search-wrap{padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.search-row{display:flex;gap:8px}
.search-row input{
  flex:1;padding:7px 10px;
  background:var(--soft);border:1px solid var(--line);
  border-radius:6px;color:var(--ink);
  font-family:var(--f-body);font-size:.875rem;
  outline:none;transition:border .15s;
}
.search-row input::placeholder{color:var(--muted)}
.search-row input:focus{border-color:var(--accent)}
.search-row button{
  padding:7px 14px;background:var(--accent);color:#fff;
  border:none;border-radius:6px;font-family:var(--f-body);
  font-size:.875rem;font-weight:600;cursor:pointer;
  transition:opacity .15s;white-space:nowrap;
}
.search-row button:hover{opacity:.85}

/* ── Scroll body ─────────────────────────────────────── */
.rail-body{
  overflow-y:auto;flex:1;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.rail-body::-webkit-scrollbar{width:4px}
.rail-body::-webkit-scrollbar-track{background:transparent}
.rail-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

/* ── Prompt state ────────────────────────────────────── */
.prompt{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;padding:40px 24px;
  color:var(--muted);text-align:center;
}
.prompt svg{opacity:.35}
.prompt p{font-size:.85rem;line-height:1.5}

/* ── Section label ───────────────────────────────────── */
.sec-label{
  font-family:var(--f-display);
  font-size:.7rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);
  padding:16px 20px 6px;
}

/* ── Location header ─────────────────────────────────── */
.loc-head{
  padding:14px 20px;
  border-bottom:1px solid var(--line);
}
.loc-coords{
  font-family:var(--f-mono);font-size:.75rem;color:var(--muted);
}
.loc-name{
  font-family:var(--f-display);font-size:1.1rem;font-weight:700;
  color:var(--ink);margin-top:2px;
}
.loc-sub{font-size:.8rem;color:var(--muted);margin-top:2px}

/* ── Tab strip ───────────────────────────────────────── */
.tab-strip{
  display:flex;gap:6px;
  padding:14px 20px 0;
}
.tab{
  flex:1;padding:8px 6px;
  border:1px solid var(--line);border-radius:6px;
  background:var(--soft);cursor:pointer;
  font-family:var(--f-body);font-size:.8rem;font-weight:600;
  color:var(--muted);text-align:center;
  transition:all .15s;
}
.tab.rcp26.active{background:var(--ok);border-color:var(--ok);color:#fff}
.tab.rcp85.active{background:var(--bad);border-color:var(--bad);color:#fff}
.tab.yr.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:hover:not(.active){border-color:var(--accent);color:var(--accent)}

.tab-label{font-size:.65rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px}
.tab-sub{font-size:.7rem;font-weight:400;opacity:.85}

.yr-tabs{display:flex;gap:6px;padding:6px 20px 0}
.yr-tabs .tab{font-size:.85rem}

/* ── Metric list ─────────────────────────────────────── */
.metric-list{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.metric-item{}
.metric-name{font-size:.75rem;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.metric-val{font-family:var(--f-mono);font-size:.95rem;font-weight:600;color:var(--ink)}
.metric-bar-wrap{height:3px;background:var(--soft);border-radius:2px;margin-top:4px}
.metric-bar{height:3px;border-radius:2px;transition:width .4s}

/* ── Confidence badge ────────────────────────────────── */
.conf-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:3px;
  font-family:var(--f-mono);font-size:.65rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
}
.conf-badge.hi{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.conf-badge.med{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.conf-badge.lo{background:var(--soft);color:var(--muted)}

/* ── Risk tag ────────────────────────────────────────── */
.risk-tag{
  display:inline-flex;align-items:center;
  padding:1px 6px;border-radius:3px;
  font-family:var(--f-mono);font-size:.65rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
}
.risk-tag.hi{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.risk-tag.md{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.risk-tag.lo{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

/* ── Card ────────────────────────────────────────────── */
.card{
  margin:0 20px;
  border:1px solid var(--line);border-radius:8px;
  overflow:hidden;
}
.card + .card{margin-top:10px}

.card-head{
  background:var(--soft);
  padding:10px 14px;
  font-family:var(--f-display);font-size:.85rem;font-weight:700;
  color:var(--ink);
  display:flex;align-items:center;gap:6px;
}
.card-body{padding:12px 14px}
.card-body p{font-size:.8rem;color:var(--muted);line-height:1.5}

/* ── Seasonal 2×2 grid ───────────────────────────────── */
.season-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--line);
}
.season-cell{background:var(--panel);padding:10px 12px}
.season-cell .slabel{
  font-family:var(--f-display);font-size:.7rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin-bottom:4px;
}
.season-cell p{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ── Outlook grid 2×2 ────────────────────────────────── */
.outlook-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--line);
}
.outlook-cell{background:var(--panel);padding:10px 12px}
.outlook-cell .yr{
  font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--muted);
  margin-bottom:3px;
}
.outlook-cell p{font-size:.75rem;color:var(--ink);line-height:1.4}

/* ── TR section ──────────────────────────────────────── */
.tr-wrap{padding:0 20px 20px}
.tr-select{
  width:100%;padding:8px 10px;
  background:var(--soft);border:1px solid var(--line);
  border-radius:6px;color:var(--ink);
  font-family:var(--f-body);font-size:.875rem;
  outline:none;cursor:pointer;
}
.tr-select:focus{border-color:var(--accent)}

.urgency-bar{
  margin-top:12px;
  height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));
  position:relative;
}
.urgency-pin{
  position:absolute;top:-4px;
  width:14px;height:14px;
  background:var(--panel);border:2px solid var(--ink);
  border-radius:50%;transform:translateX(-50%);
  transition:left .4s;
}
.urgency-label{
  display:flex;justify-content:space-between;
  font-size:.65rem;color:var(--muted);margin-top:4px;
}

.tr-cards{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-top:12px;
}
.tr-card{
  border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;background:var(--panel);
}
.tr-card-icon{font-size:1rem;margin-bottom:4px}
.tr-card-title{
  font-family:var(--f-display);font-size:.8rem;font-weight:700;
  color:var(--ink);margin-bottom:4px;
}
.tr-card-body{font-size:.72rem;color:var(--muted);line-height:1.4}

.opp-panel{
  margin-top:10px;
  border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);
  border-radius:6px;
  background:color-mix(in srgb,var(--ok) 8%,transparent);
  padding:12px 14px;
}
.opp-panel .opp-label{
  font-family:var(--f-display);font-size:.7rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ok);
  margin-bottom:6px;
}
.opp-panel p{font-size:.78rem;color:var(--ink);line-height:1.45}

/* ── Disclaimer ──────────────────────────────────────── */
.disclaimer{
  padding:12px 20px 20px;
  font-size:.7rem;color:var(--muted);line-height:1.5;
}

/* ── Map ─────────────────────────────────────────────── */
.map-wrap{position:relative;overflow:hidden}
#map{width:100%;height:100%}

.map-hint{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:6px 14px;
  font-size:.75rem;color:var(--muted);
  pointer-events:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.theme-btn{
  position:absolute;top:12px;right:12px;z-index:10;
  width:32px;height:32px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.85rem;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
  transition:color .15s;
}
.theme-btn:hover{color:var(--ink)}

/* ── Mobile ──────────────────────────────────────────── */
@media(max-width:768px){
  .app{grid-template-columns:1fr;grid-template-rows:45vh 1fr;height:100dvh}
  .map-wrap{order:1}
  .rail{order:2;border-right:none;border-top:1px solid var(--line)}
  .rail-head{padding:12px 16px 10px}
  .rail-head h1{font-size:1.05rem}
  .search-wrap{padding:10px 16px}
  .sec-label,.metric-list,.card,.tr-wrap,.disclaimer{
    padding-left:16px;padding-right:16px;
  }
  .card{margin:0 16px}
  .tab-strip{padding:10px 16px 0}
  .yr-tabs{padding:6px 16px 0}
}
</style>
</head>

// ── Region detection ──────────────────────────────────
function detectRegion(lat, lng) {
  // AUS check
  for(const [name, r] of Object.entries(AUS)) {
    const [minLat,maxLat,minLng,maxLng] = r.bb;
    if(lat>=minLat && lat<=maxLat && lng>=minLng && lng<=maxLng) return {type:'aus',name,data:r};
  }
  // NZ check
  for(const [name, r] of Object.entries(NZ)) {
    const [minLat,maxLat,minLng,maxLng] = r.bb;
    if(lat>=minLat && lat<=maxLat && lng>=minLng && lng<=maxLng) return {type:'nz',name,data:r};
  }
  return null;
}

function detectGlobal(lat, lng) {
  if(lat>60) return lat>80 ? 'Antarctica' : 'Arctic';
  if(lat < -60) return 'Antarctica';
  if(lng > 100 && lat > 0 && lat < 55) return 'East Asia';
  if(lng > 60 && lng < 100 && lat > 0 && lat < 40) return 'South Asia';
  if(lng > -30 && lng < 60 && lat > 0) return 'Europe';
  if(lng > -30 && lng < 60 && lat <= 0) return 'Africa';
  if(lng > -170 && lng < -30 && lat > 0) return 'North America';
  if(lng > -90 && lng < -30 && lat <= 0) return 'Latin America';
  if(lng > 30 && lng < 70 && lat > 5 && lat < 40) return 'Middle East';
  if(lng > 130 || (lng < -120 && lat < 30)) return 'Pacific Islands';
  return 'Pacific Islands';
}

// ── Select location ───────────────────────────────────
function select(lat, lng, label) {
  marker.setLngLat([lng, lat]);
  marker.getElement().style.display = 'block';
  map.flyTo({center:[lng,lat], zoom:5.5, duration:800});

  const region = detectRegion(lat, lng);
  if(region) {
    curRegion = region;
    curGlobal = null;
    renderDetail(region);
  } else {
    curRegion = null;
    const gname = detectGlobal(lat, lng);
    curGlobal = {name: gname || 'Global', lat, lng, label};
    renderGlobal(lat, lng, label || gname || 'Selected Location');
  }
  document.getElementById('prompt-state').style.display = 'none';
  document.getElementById('detail-state').style.display = 'block';
}

// ── Transitional Risk section ─────────────────────────
function renderTRSection() {
  const cats = [...new Set(Object.values(TRDATA).map(v=>v.cat))];
  let opts = '';
  cats.forEach(cat => {
    opts += `<optgroup label="${cat}">`;
    Object.entries(TRDATA).filter(([,v])=>v.cat===cat).forEach(([name])=>{
      opts += `<option value="${name}">${name}</option>`;
    });
    opts += `</optgroup>`;
  });

  return `
    <div class="sec-label">Transitional Climate Risk</div>
    <div class="tr-wrap">
      <select class="tr-select" id="tr-select" onchange="renderTR()">
        ${opts}
      </select>
      <div id="tr-content"></div>
    </div>
  `;
}

function initTR() {
  const sel = document.getElementById('tr-select');
  if(sel) renderTR();
}

function renderTR() {
  const sel = document.getElementById('tr-select');
  if(!sel) return;
  const name = sel.value;
  const d = TRDATA[name];
  if(!d) return;

  const pct = d.urgency;
  const icons = ['⚡','🏦','📉','🔥'];
  const urgLabel = pct >= 80 ? 'Very High' : pct >= 60 ? 'High' : pct >= 40 ? 'Moderate' : 'Low';

  let html = `
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:.75rem;color:var(--muted)">${d.cat}</span>
        <span class="risk-tag ${pct>=70?'hi':pct>=40?'md':'lo'}">${urgLabel} transition urgency</span>
      </div>
      <div class="urgency-bar">
        <div class="urgency-pin" style="left:${pct}%"></div>
      </div>
      <div class="urgency-label"><span>Low</span><span>Moderate</span><span>High</span><span>Very High</span></div>
    </div>
    <div class="tr-cards">
      ${d.risks.slice(0,4).map((r,i)=>`
        <div class="tr-card">
          <div class="tr-card-icon">${icons[i]||'⚠'}</div>
          <div class="tr-card-title">Risk ${i+1}</div>
          <div class="tr-card-body">${r}</div>
        </div>
      `).join('')}
    </div>
    <div class="opp-panel">
      <div class="opp-label">📈 Opportunity</div>
      <p>${d.opp}</p>
    </div>
    <div class="sec-label" style="padding-left:0;margin-top:12px">Outlook</div>
    <div class="card" style="margin:0 0 12px">
      <div class="outlook-grid">
        <div class="outlook-cell">
          <div class="yr">2030</div>
          <p>${d.out2030}</p>
        </div>
        <div class="outlook-cell">
          <div class="yr">2050</div>
          <p>${d.out2050}</p>
        </div>
      </div>
    </div>
  `;

  document.getElementById('tr-content').innerHTML = html;
}

// ── Tab switching ─────────────────────────────────────
function switchScen(sc) {
  activeScen = sc;
  if(curRegion) renderDetail(curRegion);
  else if(curGlobal) renderGlobal(curGlobal.lat, curGlobal.lng, curGlobal.label);
}

function switchYr(yr) {
  activeYr = yr;
  if(curRegion) renderDetail(curRegion);
  else if(curGlobal) renderGlobal(curGlobal.lat, curGlobal.lng, curGlobal.label);
}

// ── Geocoding search ──────────────────────────────────
document.getElementById('search-btn').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;
  const btn = document.getElementById('search-btn');
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${mapboxgl.accessToken}&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.features && data.features.length > 0) {
      const f = data.features[0];
      const [lng, lat] = f.center;
      select(lat, lng, f.place_name);
    } else {
      alert('Location not found. Try a different search.');
    }
  } catch(e) {
    alert('Search error. Please try again.');
  }
  btn.textContent = 'Search';
  btn.disabled = false;
}
