<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Impact Explorer</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; overflow: hidden; }
header { background: linear-gradient(135deg, #1a2a1a, #0d1f2d); padding: 10px 18px; border-bottom: 1px solid #2a3a2a; }
header h1 { font-size: 1.05rem; font-weight: 700; color: #7dd87d; }
header p { font-size: 0.7rem; color: #8aaa8a; margin-top: 2px; }
.layout { display: flex; height: calc(100vh - 50px); }
.map-panel { position: relative; flex: 1; min-width: 0; }
#map { position: absolute; inset: 0; }
.search-bar { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10; display: flex; gap: 6px; }
.search-bar input { flex: 1; padding: 9px 13px; border-radius: 8px; border: 1px solid #3a5a3a; background: rgba(10,12,18,0.92); color: #e0e0e0; font-size: 0.83rem; backdrop-filter: blur(6px); }
.search-bar input::placeholder { color: #5a8a5a; }
.search-bar input:focus { outline: none; border-color: #7dd87d; }
.search-bar button { padding: 9px 14px; border-radius: 8px; border: none; background: #2d6a2d; color: #cfc; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
.search-bar button:hover { background: #3a8a3a; }
.map-hint { position: absolute; bottom: 30px; left: 12px; z-index: 10; background: rgba(10,12,18,0.82); border: 1px solid #2a3a2a; border-radius: 6px; padding: 5px 10px; font-size: 0.68rem; color: #6a9a6a; pointer-events: none; }
.info-panel { width: 400px; overflow-y: auto; background: #0f1117; padding: 14px; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid #1a2a1a; }
.placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #4a6a4a; text-align: center; gap: 10px; }
.placeholder .icon { font-size: 2.5rem; }
.placeholder p { font-size: 0.82rem; line-height: 1.6; max-width: 240px; }
.location-header { background: #1a2a1a; border-radius: 10px; padding: 12px 14px; border: 1px solid #2a3a2a; }
.location-header h2 { font-size: 0.92rem; color: #7dd87d; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.location-header p { font-size: 0.72rem; color: #8aaa8a; }
.scenario-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scenario-card { border-radius: 10px; padding: 11px; border: 1px solid; }
.scenario-card.green { border-color: #2d6a2d; background: #0d1f0d; }
.scenario-card.red { border-color: #6a1a1a; background: #1f0d0d; }
.scenario-card h3 { font-size: 0.76rem; font-weight: 700; }
.scenario-card.green h3 { color: #7dd87d; }
.scenario-card.red h3 { color: #d87d7d; }
.sublabel { font-size: 0.63rem; color: #6a8a6a; margin-bottom: 7px; }
.year-tabs { display: flex; gap: 5px; margin: 5px 0 8px; }
.year-tab { padding: 2px 9px; border-radius: 20px; font-size: 0.67rem; font-weight: 600; cursor: pointer; border: 1px solid; }
.year-tab.green { border-color: #3a7a3a; color: #6c6; }
.year-tab.green.active { background: #2d6a2d; color: #cfc; }
.year-tab.red { border-color: #7a3a3a; color: #c66; }
.year-tab.red.active { background: #6a1a1a; color: #fcc; }
.metric { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
.metric .em { font-size: 0.85rem; margin-top: 1px; }
.metric-info { flex: 1; }
.metric-label { font-size: 0.62rem; color: #7a9a7a; }
.metric-value { font-size: 0.76rem; font-weight: 600; }
.metric-value.green { color: #9de89d; }
.metric-value.red { color: #e89d9d; }
.bar-track { height: 3px; background: #2a2a2a; border-radius: 2px; margin-top: 2px; }
.bar-fill { height: 100%; border-radius: 2px; }
.bar-fill.green { background: linear-gradient(90deg,#3a8a3a,#7dd87d); }
.bar-fill.red { background: linear-gradient(90deg,#8a3a3a,#d87d7d); }
.narrative-box { background: #141c14; border: 1px solid #2a3a2a; border-radius: 10px; padding: 12px 14px; }
.narrative-box h3 { font-size: 0.76rem; color: #7dd87d; margin-bottom: 7px; }
.narrative-box p { font-size: 0.75rem; color: #b0c0b0; line-height: 1.6; margin-bottom: 6px; }
.loading { display: flex; align-items: center; gap: 8px; color: #6a8a6a; font-size: 0.78rem; }
.spinner { width: 13px; height: 13px; border: 2px solid #2a4a2a; border-top-color: #7dd87d; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.disclaimer { font-size: 0.63rem; color: #4a6a4a; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>🌍 Climate Impact Explorer</h1>
  <p>Click any location on the map or search an address · 2030 & 2050 · RCP 2.6 vs RCP 8.5</p>
</header>
<div class="layout">
  <div class="map-panel">
    <div class="search-bar">
      <input id="addrInput" type="text" placeholder="Search a city or address..." />
      <button onclick="doSearch()">Search</button>
    </div>
    <div id="map"></div>
    <div class="map-hint">📍 Click anywhere on the map to explore climate projections</div>
  </div>
  <div class="info-panel" id="infoPanel">
    <div class="placeholder">
      <div class="icon">🌐</div>
      <p>Click anywhere on the map or search an address to explore projected climate impacts.</p>
    </div>
  </div>
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoidGhhbWciLCJhIjoiY21vbWN1YjB6MDQwMDJxb2lmYXRpM3B0ZCJ9.2OC9wT06Scpwl18M18EKlg';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [20, 20],
  zoom: 1.8,
  projection: 'globe'
});

map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
map.addControl(new mapboxgl.ScaleControl(), 'bottom-left');

map.on('style.load', () => {
  map.setFog({
    color: 'rgb(10,15,25)',
    'high-color': 'rgb(20,40,60)',
    'horizon-blend': 0.02,
    'space-color': 'rgb(5,8,15)',
    'star-intensity': 0.8
  });
});

let marker = null;

map.on('click', e => {
  const { lng, lat } = e.lngLat;
  placeMarker(lat, lng);
  selectLocation(lat, lng, null);
});

function placeMarker(lat, lng) {
  if (marker) marker.remove();
  const el = document.createElement('div');
  el.style.cssText = 'width:16px;height:16px;background:#7dd87d;border:2.5px solid white;border-radius:50%;box-shadow:0 0 12px #7dd87d88;';
  marker = new mapboxgl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
}

document.getElementById('addrInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const q = document.getElementById('addrInput').value.trim();
  if (!q) return;
  try {
    const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${mapboxgl.accessToken}&limit=1`);
    const data = await res.json();
    if (!data.features?.length) { alert('Location not found.'); return; }
    const [lng, lat] = data.features[0].center;
    placeMarker(lat, lng);
    map.flyTo({ center: [lng, lat], zoom: 5, duration: 1400 });
    selectLocation(lat, lng, data.features[0].place_name);
  } catch(e) { alert('Search failed. Please try again.'); }
}

const climateDB = {
  arctic:           { rcp26:{ '2030':{temp:'+1.8°C',heatDays:'+5 days >30°C',precip:'+8% wetter',sealevel:'+8cm',wildfire:'Low–Moderate',extreme:'Moderate'}, '2050':{temp:'+2.2°C',heatDays:'+10 days',precip:'+12% wetter',sealevel:'+15cm',wildfire:'Moderate',extreme:'Moderate'} }, rcp85:{ '2030':{temp:'+2.5°C',heatDays:'+12 days',precip:'+10% wetter',sealevel:'+12cm',wildfire:'Moderate–High',extreme:'High'}, '2050':{temp:'+4.5°C',heatDays:'+35 days',precip:'+18% wetter',sealevel:'+28cm',wildfire:'High',extreme:'Very High'} } },
  mediterranean:    { rcp26:{ '2030':{temp:'+1.5°C',heatDays:'+15 days >35°C',precip:'−10% drier',sealevel:'+8cm',wildfire:'Moderate–High',extreme:'Moderate'}, '2050':{temp:'+1.8°C',heatDays:'+25 days',precip:'−15% drier',sealevel:'+15cm',wildfire:'High',extreme:'High'} }, rcp85:{ '2030':{temp:'+2.0°C',heatDays:'+25 days',precip:'−15% drier',sealevel:'+12cm',wildfire:'High',extreme:'High'}, '2050':{temp:'+3.8°C',heatDays:'+60 days',precip:'−30% drier',sealevel:'+28cm',wildfire:'Very High',extreme:'Very High'} } },
  australia:        { rcp26:{ '2030':{temp:'+1.3°C',heatDays:'+20 days >35°C',precip:'Variable ±5%',sealevel:'+9cm',wildfire:'High',extreme:'Moderate–High'}, '2050':{temp:'+1.7°C',heatDays:'+35 days',precip:'−10% south',sealevel:'+17cm',wildfire:'Very High',extreme:'High'} }, rcp85:{ '2030':{temp:'+1.8°C',heatDays:'+30 days',precip:'−10% south',sealevel:'+13cm',wildfire:'Very High',extreme:'High'}, '2050':{temp:'+3.5°C',heatDays:'+80 days',precip:'−20% south',sealevel:'+28cm',wildfire:'Extreme',extreme:'Very High'} } },
  north_america:    { rcp26:{ '2030':{temp:'+1.4°C',heatDays:'+10 days >35°C',precip:'+5% north, variable',sealevel:'+8cm',wildfire:'Moderate–High',extreme:'Moderate'}, '2050':{temp:'+1.8°C',heatDays:'+20 days',precip:'+8% north, −10% SW',sealevel:'+16cm',wildfire:'High',extreme:'Moderate–High'} }, rcp85:{ '2030':{temp:'+2.0°C',heatDays:'+18 days',precip:'+5% north, −15% SW',sealevel:'+12cm',wildfire:'High',extreme:'High'}, '2050':{temp:'+4.0°C',heatDays:'+55 days',precip:'+15% north, −25% SW',sealevel:'+28cm',wildfire:'Very High',extreme:'Very High'} } },
  europe:           { rcp26:{ '2030':{temp:'+1.4°C',heatDays:'+8 days >30°C',precip:'+5% north, −8% south',sealevel:'+8cm',wildfire:'Low–Moderate',extreme:'Moderate'}, '2050':{temp:'+1.7°C',heatDays:'+15 days',precip:'+8% north, −12% south',sealevel:'+16cm',wildfire:'Moderate',extreme:'Moderate'} }, rcp85:{ '2030':{temp:'+1.9°C',heatDays:'+15 days',precip:'+5% north, −12% south',sealevel:'+12cm',wildfire:'Moderate',extreme:'High'}, '2050':{temp:'+3.6°C',heatDays:'+45 days',precip:'+12% north, −25% south',sealevel:'+28cm',wildfire:'High',extreme:'Very High'} } },
  south_asia:       { rcp26:{ '2030':{temp:'+1.4°C',heatDays:'+20 days >35°C',precip:'+5% monsoon',sealevel:'+9cm',wildfire:'Low–Moderate',extreme:'High'}, '2050':{temp:'+1.7°C',heatDays:'+35 days',precip:'+10% monsoon',sealevel:'+18cm',wildfire:'Moderate',extreme:'High'} }, rcp85:{ '2030':{temp:'+2.0°C',heatDays:'+30 days',precip:'+8% monsoon, intense',sealevel:'+13cm',wildfire:'Moderate',extreme:'Very High'}, '2050':{temp:'+4.0°C',heatDays:'+70 days',precip:'+20% monsoon, extreme',sealevel:'+30cm',wildfire:'High',extreme:'Extreme'} } },
  tropical_africa:  { rcp26:{ '2030':{temp:'+1.5°C',heatDays:'+25 days >35°C',precip:'Variable ±10%',sealevel:'+8cm',wildfire:'Moderate–High',extreme:'Moderate'}, '2050':{temp:'+1.9°C',heatDays:'+45 days',precip:'−10% Sahel, +5% equatorial',sealevel:'+17cm',wildfire:'High',extreme:'High'} }, rcp85:{ '2030':{temp:'+2.2°C',heatDays:'+40 days',precip:'−15% Sahel',sealevel:'+13cm',wildfire:'High',extreme:'High'}, '2050':{temp:'+4.5°C',heatDays:'+100+ days',precip:'−25% Sahel',sealevel:'+30cm',wildfire:'Very High',extreme:'Extreme'} } },
  tropical_americas:{ rcp26:{ '2030':{temp:'+1.4°C',heatDays:'+20 days >35°C',precip:'−5% Amazon',sealevel:'+8cm',wildfire:'High',extreme:'Moderate–High'}, '2050':{temp:'+1.7°C',heatDays:'+35 days',precip:'−10% Amazon',sealevel:'+16cm',wildfire:'High',extreme:'High'} }, rcp85:{ '2030':{temp:'+2.0°C',heatDays:'+30 days',precip:'−10% Amazon',sealevel:'+13cm',wildfire:'Very High',extreme:'High'}, '2050':{temp:'+4.0°C',heatDays:'+80 days',precip:'−30% Amazon (dieback risk)',sealevel:'+28cm',wildfire:'Extreme',extreme:'Very High'} } },
  mideast:          { rcp26:{ '2030':{temp:'+1.6°C',heatDays:'+25 days >40°C',precip:'−10% drier',sealevel:'+8cm',wildfire:'Low–Moderate',extreme:'Moderate'}, '2050':{temp:'+2.0°C',heatDays:'+45 days',precip:'−15% drier',sealevel:'+16cm',wildfire:'Moderate',extreme:'High'} }, rcp85:{ '2030':{temp:'+2.3°C',heatDays:'+40 days',precip:'−15% drier',sealevel:'+12cm',wildfire:'Moderate',extreme:'High'}, '2050':{temp:'+4.5°C',heatDays:'+100+ days >40°C',precip:'−30% drier',sealevel:'+28cm',wildfire:'High',extreme:'Extreme'} } },
  sh_temperate:     { rcp26:{ '2030':{temp:'+1.2°C',heatDays:'+10 days >30°C',precip:'−5% variable',sealevel:'+8cm',wildfire:'Moderate',extreme:'Moderate'}, '2050':{temp:'+1.6°C',heatDays:'+20 days',precip:'−10%',sealevel:'+16cm',wildfire:'Moderate–High',extreme:'Moderate–High'} }, rcp85:{ '2030':{temp:'+1.8°C',heatDays:'+18 days',precip:'−10%',sealevel:'+13cm',wildfire:'High',extreme:'High'}, '2050':{temp:'+3.5°C',heatDays:'+50 days',precip:'−20%',sealevel:'+28cm',wildfire:'Very High',extreme:'Very High'} } },
  global:           { rcp26:{ '2030':{temp:'+1.3°C',heatDays:'+10 days',precip:'Variable ±8%',sealevel:'+8cm',wildfire:'Moderate',extreme:'Moderate'}, '2050':{temp:'+1.6°C',heatDays:'+18 days',precip:'Variable ±12%',sealevel:'+16cm',wildfire:'Moderate',extreme:'Moderate–High'} }, rcp85:{ '2030':{temp:'+1.8°C',heatDays:'+15 days',precip:'Variable ±12%',sealevel:'+12cm',wildfire:'Moderate–High',extreme:'High'}, '2050':{temp:'+3.5°C',heatDays:'+45 days',precip:'Variable ±20%',sealevel:'+28cm',wildfire:'High',extreme:'Very High'} } },
};

function getRegion(lat, lng) {
  const coastal = (lat>-35&&lat<35&&lng>-100&&lng<-70)||(lat>35&&lat<72&&lng>-10&&lng<30)||(lat>-40&&lat<-10&&lng>110&&lng<155)||(lat>-35&&lat<35&&lng>10&&lng<52);
  if (lat>60) return {id:'arctic',name:'Arctic & Subarctic',coastal};
  if (lat>=-45&&lat<=-10&&lng>=110&&lng<=155) return {id:'australia',name:'Australia',coastal};
  if (lat>=30&&lat<=45&&lng>=-10&&lng<=40) return {id:'mediterranean',name:'Mediterranean',coastal};
  if (lat>=25&&lat<=72&&lng>=-170&&lng<=-50) return {id:'north_america',name:'North America',coastal};
  if (lat>=35&&lat<=72&&lng>=-25&&lng<=45) return {id:'europe',name:'Europe',coastal};
  if (lat>=15&&lat<=55&&lng>=25&&lng<=75) return {id:'mideast',name:'Middle East & Central Asia',coastal};
  if (lat>=-10&&lat<=35&&lng>=60&&lng<=150) return {id:'south_asia',name:'South & Southeast Asia',coastal};
  if (lat>=-23&&lat<=23&&lng>=-120&&lng<=-30) return {id:'tropical_americas',name:'Tropical Americas',coastal};
  if (lat>=-23&&lat<=23&&lng>=-20&&lng<=55) return {id:'tropical_africa',name:'Tropical Africa',coastal};
  if (lat<-23&&lat>-60) return {id:'sh_temperate',name:'Southern Hemisphere Temperate',coastal};
  return {id:'global',name:'Temperate Region',coastal};
}

const riskScore = {'Low':10,'Low–Moderate':25,'Moderate':40,'Moderate–High':55,'High':70,'Very High':85,'Extreme':100};
function getRisk(v) { for (const k of Object.keys(riskScore)) if (v.startsWith(k)) return riskScore[k]; return 50; }

function renderMetrics(color, d) {
  return [
    {em:'🌡️',label:'Temperature Change',val:d.temp},
    {em:'☀️',label:'Extra Extreme Heat Days/yr',val:d.heatDays},
    {em:'🌧️',label:'Precipitation Change',val:d.precip},
    {em:'🌊',label:'Sea Level Rise',val:d.sealevel},
    {em:'🔥',label:'Wildfire Risk',val:d.wildfire,bar:true},
    {em:'🌀',label:'Extreme Weather',val:d.extreme,bar:true},
  ].map(m=>`<div class="metric"><span class="em">${m.em}</span><div class="metric-info"><div class="metric-label">${m.label}</div><div class="metric-value ${color}">${m.val}</div>${m.bar?`<div class="bar-track"><div class="bar-fill ${color}" style="width:${getRisk(m.val)}%"></div></div>`:''}</div></div>`).join('');
}

function switchYear(color, year) {
  const d = window._cd; if (!d) return;
  const p = color==='green'?'g':'r', sc = color==='green'?'rcp26':'rcp85';
  document.getElementById(`${p}2030`).classList.toggle('active', year==='2030');
  document.getElementById(`${p}2050`).classList.toggle('active', year==='2050');
  document.getElementById(`${color}-metrics`).innerHTML = renderMetrics(color, d[sc][year]);
}

async function selectLocation(lat, lng, label) {
  const region = getRegion(lat, lng);
  const name = label || `${lat.toFixed(2)}°, ${lng.toFixed(2)}°`;
  const short = name.split(',').slice(0,2).join(',');
  const data = climateDB[region.id] || climateDB.global;
  window._cd = data;

  document.getElementById('infoPanel').innerHTML = `
    <div class="location-header">
      <h2>📍 ${short}</h2>
      <p>${region.name}${region.coastal?' · Coastal':''} · ${lat.toFixed(2)}°, ${lng.toFixed(2)}°</p>
    </div>
    <div class="scenario-grid">
      <div class="scenario-card green">
        <h3>🟢 RCP 2.6</h3>
        <div class="sublabel">Rapid decarbonisation ~1.5–2°C</div>
        <div class="year-tabs">
          <div class="year-tab green" id="g2030" onclick="switchYear('green','2030')">2030</div>
          <div class="year-tab green active" id="g2050" onclick="switchYear('green','2050')">2050</div>
        </div>
        <div id="green-metrics">${renderMetrics('green', data.rcp26['2050'])}</div>
      </div>
      <div class="scenario-card red">
        <h3>🔴 RCP 8.5</h3>
        <div class="sublabel">Business as usual 4°C+</div>
        <div class="year-tabs">
          <div class="year-tab red" id="r2030" onclick="switchYear('red','2030')">2030</div>
          <div class="year-tab red active" id="r2050" onclick="switchYear('red','2050')">2050</div>
        </div>
        <div id="red-metrics">${renderMetrics('red', data.rcp85['2050'])}</div>
      </div>
    </div>
    <div class="narrative-box" id="nb">
      <h3>🤖 AI Impact Summary</h3>
      <div class="loading"><div class="spinner"></div> Generating narrative...</div>
    </div>
    <div class="disclaimer">⚠️ Projections based on IPCC AR6 regional ensemble medians. Local conditions vary. Not for engineering or policy use without site-specific assessment.</div>
  `;

  const d26=data.rcp26['2050'], d85=data.rcp85['2050'];
  const prompt=`You are a climate scientist. Write a concise 3-paragraph narrative (no headers, no bullets) about projected physical climate impacts for: "${name}" (${region.name}${region.coastal?', coastal':''}).
RCP 2.6 by 2050: Temp ${d26.temp}, ${d26.heatDays} extra heat days, Precip ${d26.precip}, Sea level ${d26.sealevel}, Wildfire ${d26.wildfire}, Extreme weather ${d26.extreme}.
RCP 8.5 by 2050: Temp ${d85.temp}, ${d85.heatDays} extra heat days, Precip ${d85.precip}, Sea level ${d85.sealevel}, Wildfire ${d85.wildfire}, Extreme weather ${d85.extreme}.
Para 1: Life under rapid decarbonisation by 2050. Para 2: Life under business as usual — specific real consequences. Para 3: What decarbonisation buys this region + one key adaptation. Under 200 words, plain language.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:1000, messages:[{role:'user',content:prompt}]})
    });
    const j = await res.json();
    const text = j.content?.[0]?.text || 'Narrative unavailable.';
    document.getElementById('nb').innerHTML = `<h3>🤖 AI Impact Summary</h3>${text.split('\n\n').filter(p=>p.trim()).map(p=>`<p>${p.trim()}</p>`).join('')}`;
  } catch(e) {
    document.getElementById('nb').innerHTML = `<h3>🤖 AI Impact Summary</h3><p>AI narrative unavailable — check your connection.</p>`;
  }
}
</script>
</body>
</html>
